<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Frame 2: kamera bergerak mendekati produk">
<title>Frame 2: kamera bergerak mendekati produk</title>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
  <feBlend in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141210"/><stop offset="1" stop-color="#070707"/></linearGradient>
<radialGradient id="spot" cx="0.5" cy="0.42" r="0.55"><stop offset="0" stop-color="#6b5a45" stop-opacity="0.47"/><stop offset="0.55" stop-color="#2a241e" stop-opacity="0.28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="surf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2724"/><stop offset="1" stop-color="#0e0d0c"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0.30"/><stop offset="0.12" stop-color="#fff" stop-opacity="0.06"/>
  <stop offset="0.5" stop-color="#fff" stop-opacity="0.02"/><stop offset="0.86" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0.35"/></linearGradient>
<linearGradient id="liq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c97a"/><stop offset="0.55" stop-color="#d9963f"/><stop offset="1" stop-color="#b8732a"/></linearGradient>
<linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121110"/><stop offset="0.3" stop-color="#3a3632"/><stop offset="0.5" stop-color="#1a1816"/><stop offset="0.82" stop-color="#4a4540"/><stop offset="1" stop-color="#0d0c0b"/></linearGradient>
<linearGradient id="collar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a77d3c"/><stop offset="0.35" stop-color="#e9cf9b"/><stop offset="0.6" stop-color="#a77d3c"/><stop offset="1" stop-color="#5e4520"/></linearGradient>
<linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9963f" stop-opacity="0.35"/><stop offset="1" stop-color="#d9963f" stop-opacity="0"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9c4" stop-opacity="0"/><stop offset="0.5" stop-color="#ffe9c4" stop-opacity="0.14"/><stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/></linearGradient>
<clipPath id="bottleClip"><rect x="-130" y="-170" width="260" height="300" rx="34"/></clipPath></defs>
<g>
<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#spot)"/>
<rect x="0" y="420" width="800" height="180" fill="url(#surf)"/>
<rect x="0" y="420" width="800" height="2" fill="#5a4e42" opacity="0.5"/>
<polygon points="496,0 656,0 440,468 240,468" fill="url(#beam)" filter="url(#soft)"/>
<g transform="translate(400 470) scale(1.05)">
  <ellipse cx="0" cy="138" rx="190" ry="22" fill="#000" opacity="0.6" filter="url(#soft2)"/>
  <!-- reflection -->
  <g transform="translate(0 276) scale(1 -1)" opacity="0.5">
    <rect x="-130" y="-8" width="260" height="146" rx="30" fill="url(#refl)"/>
  </g>
  <!-- bottle body -->
  <rect x="-130" y="-170" width="260" height="300" rx="34" fill="#1d1712" opacity="0.65"/>
  <rect x="-112" y="-118" width="224" height="232" rx="22" fill="url(#liq)" opacity="0.55"/>
  <rect x="-112" y="-118" width="224" height="26" rx="10" fill="#fff3d6" opacity="0.22"/>
  <rect x="-130" y="-170" width="260" height="300" rx="34" fill="url(#glass)"/>
  <rect x="-130" y="-170" width="260" height="300" rx="34" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="-118" y="88" width="236" height="34" rx="14" fill="#fff" opacity="0.10"/>
  <rect x="-104" y="-150" width="12" height="250" rx="6" fill="#fff" opacity="0.36"/>
  <rect x="88" y="-140" width="6" height="220" rx="3" fill="#fff" opacity="0.25"/>
  
  <!-- label -->
  <rect x="-58" y="-20" width="116" height="62" rx="4" fill="#f7efe1" opacity="0.92"/>
  <rect x="-40" y="-2" width="80" height="5" rx="2.5" fill="#2a2420"/>
  <rect x="-26" y="14" width="52" height="3" rx="1.5" fill="#2a2420" opacity="0.55"/>
  <rect x="-18" y="24" width="36" height="3" rx="1.5" fill="#2a2420" opacity="0.35"/>
  <!-- collar & cap -->
  <rect x="-44" y="-196" width="88" height="30" rx="5" fill="url(#collar)"/>
  <rect x="-62" y="-318" width="124" height="126" rx="16" fill="url(#cap)"/>
  <rect x="-50" y="-308" width="10" height="104" rx="5" fill="#fff" opacity="0.18"/>
  <rect x="-62" y="-318" width="124" height="126" rx="16" fill="none" stroke="#fff" stroke-opacity="0.12"/>
</g>
</g>
<rect width="800" height="600" filter="url(#grain)" opacity="0.3"/>
</svg>