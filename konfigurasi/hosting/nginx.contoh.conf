# Contoh blok server nginx untuk folder hasil build (dist/<profil>/). Sesuaikan server_name dan sertifikat.
# Hosting belum ditetapkan; berkas ini bukan pilihan penyedia.
server {
    listen 443 ssl;
    server_name GANTI_DENGAN_DOMAIN_RESMI;
    root /var/www/jagoprompt;
    index index.html;
    error_page 404 /404.html;

    types {
        text/html html; text/css css; text/javascript js; image/webp webp; image/png png; image/jpeg jpg;
        font/woff2 woff2; video/mp4 mp4; text/vtt vtt; application/xml xml; text/plain txt;
    }
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /404.html { internal; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=86400"; }   # nginx melayani Range untuk berkas statis secara bawaan
    location / { try_files $uri $uri/ =404; }
    # Staging: add_header X-Robots-Tag "noindex" always;
}
