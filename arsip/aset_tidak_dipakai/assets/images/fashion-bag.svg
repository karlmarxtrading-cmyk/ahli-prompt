<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Foto konsep fashion tas kulit di atas pedestal">
<title>Foto konsep fashion tas kulit di atas pedestal</title>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
  <feBlend in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e3dc"/><stop offset="1" stop-color="#cdc8bd"/></linearGradient>
<linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a49"/><stop offset="0.5" stop-color="#6e4f33"/><stop offset="1" stop-color="#4b3421"/></linearGradient>
<linearGradient id="flap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d5e40"/><stop offset="0.4" stop-color="#9a7854"/><stop offset="1" stop-color="#5d4129"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a88a52"/><stop offset="0.5" stop-color="#f0dca8"/><stop offset="1" stop-color="#8a6c38"/></linearGradient></defs>
<g>
<rect width="800" height="1000" fill="url(#bg)"/>
<!-- hard shadow from window -->
<g opacity="0.12" fill="#3a352c"><path d="M0 0 L300 0 L120 1000 L0 1000Z"/><path d="M420 0 L520 0 L340 1000 L240 1000Z"/></g>
<!-- pedestal -->
<rect x="170" y="700" width="460" height="300" fill="#ede9e1"/>
<rect x="170" y="700" width="460" height="22" fill="#f8f6f1"/>
<rect x="170" y="700" width="40" height="300" fill="#d6d0c4"/>
<!-- bag -->
<g transform="translate(410 690)">
 <ellipse cx="20" cy="6" rx="210" ry="18" fill="#3a3024" opacity="0.4" filter="url(#soft2)"/>
 <path d="M-120 -300 Q-120 -470 0 -470 Q120 -470 120 -300" fill="none" stroke="#5a3f28" stroke-width="20"/>
 <path d="M-120 -300 Q-120 -470 0 -470 Q120 -470 120 -300" fill="none" stroke="#8a6a49" stroke-width="6" opacity="0.6" transform="translate(-4 -4)"/>
 <path d="M-190 -300 L190 -300 L176 -20 Q174 0 150 0 L-150 0 Q-174 0 -176 -20Z" fill="url(#leather)"/>
 <path d="M-190 -300 L190 -300 L182 -150 Q0 -110 -182 -150Z" fill="url(#flap)"/>
 <path d="M-182 -150 Q0 -110 182 -150" fill="none" stroke="#3b2a1a" stroke-width="2" stroke-dasharray="6 6"/>
 <rect x="-30" y="-150" width="60" height="44" rx="6" fill="url(#metal)"/>
 <rect x="-14" y="-140" width="28" height="22" rx="3" fill="#6b5026" opacity="0.5"/>
 <rect x="-176" y="-290" width="10" height="270" rx="5" fill="#fff" opacity="0.10"/>
</g></g>
<rect width="800" height="1000" filter="url(#grain)" opacity="0.3"/>
</svg>