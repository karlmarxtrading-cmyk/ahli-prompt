<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Foto konsep lifestyle dengan lilin dan vas di meja kayu">
<title>Foto konsep lifestyle dengan lilin dan vas di meja kayu</title>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
  <feBlend in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6da"/><stop offset="1" stop-color="#ddd3c1"/></linearGradient>
<radialGradient id="glow" cx="0.62" cy="0.5" r="0.4"><stop offset="0" stop-color="#ffd896" stop-opacity="0.6"/><stop offset="1" stop-color="#ffd896" stop-opacity="0"/></radialGradient>
<linearGradient id="vase" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b7b19f"/><stop offset="0.4" stop-color="#e2ddcf"/><stop offset="1" stop-color="#9c9584"/></linearGradient>
<linearGradient id="jar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d6b56"/><stop offset="0.4" stop-color="#9aa98d"/><stop offset="1" stop-color="#4b5745"/></linearGradient>
<linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98f66"/><stop offset="1" stop-color="#8c6542"/></linearGradient></defs>
<g>
<rect width="800" height="1000" fill="url(#bg)"/>
<rect width="800" height="1000" fill="url(#glow)"/>
<rect y="720" width="800" height="280" fill="url(#table)"/>
<rect y="720" width="800" height="3" fill="#e6c49c" opacity="0.6"/>
<!-- books -->
<rect x="80" y="660" width="300" height="34" rx="3" fill="#7d8a6f"/>
<rect x="100" y="694" width="280" height="30" rx="3" fill="#e9e1d1"/>
<rect x="80" y="694" width="20" height="30" fill="#c9bfae"/>
<!-- vase with branch -->
<g transform="translate(220 660)">
 <path d="M-40 0 Q-70 -80 -40 -150 L-22 -190 L22 -190 L40 -150 Q70 -80 40 0Z" fill="url(#vase)"/>
 <path d="M0 -190 C-10 -300 -60 -380 -90 -460" stroke="#5a5040" stroke-width="5" fill="none"/>
 <path d="M-30 -330 C10 -380 30 -420 40 -480" stroke="#5a5040" stroke-width="4" fill="none"/>
 <g fill="#8a9a74"><ellipse cx="-70" cy="-420" rx="20" ry="9" transform="rotate(-40 -70 -420)"/><ellipse cx="-50" cy="-370" rx="18" ry="8" transform="rotate(30 -50 -370)"/><ellipse cx="20" cy="-440" rx="18" ry="8" transform="rotate(-50 20 -440)"/><ellipse cx="34" cy="-400" rx="16" ry="7" transform="rotate(20 34 -400)"/><ellipse cx="-90" cy="-470" rx="16" ry="7" transform="rotate(-70 -90 -470)"/></g>
</g>
<!-- candle -->
<g transform="translate(520 720)">
 <ellipse cx="10" cy="4" rx="120" ry="14" fill="#4b3622" opacity="0.4" filter="url(#soft2)"/>
 <rect x="-90" y="-170" width="180" height="170" rx="14" fill="url(#jar)"/>
 <rect x="-78" y="-160" width="10" height="150" rx="5" fill="#fff" opacity="0.25"/>
 <rect x="-50" y="-110" width="100" height="56" rx="2" fill="#f2ede2"/>
 <rect x="-30" y="-92" width="60" height="5" rx="2.5" fill="#3d4636"/>
 <rect x="-20" y="-78" width="40" height="3" rx="1.5" fill="#3d4636" opacity="0.5"/>
 <ellipse cx="0" cy="-170" rx="90" ry="12" fill="#efe7d6"/>
 <rect x="-2" y="-196" width="4" height="22" fill="#2a2a2a"/>
 <ellipse cx="0" cy="-214" rx="11" ry="24" fill="#ffcf72"/>
 <ellipse cx="0" cy="-208" rx="5" ry="12" fill="#fff6dc"/>
 <circle cx="0" cy="-210" r="70" fill="#ffd27a" opacity="0.18" filter="url(#soft)"/>
</g></g>
<rect width="800" height="1000" filter="url(#grain)" opacity="0.3"/>
</svg>