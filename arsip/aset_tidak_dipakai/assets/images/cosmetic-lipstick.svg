<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Foto konsep kosmetik lipstik dengan latar lengkung">
<title>Foto konsep kosmetik lipstik dengan latar lengkung</title>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
  <feBlend in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e1db"/><stop offset="1" stop-color="#d9bfb5"/></linearGradient>
<linearGradient id="tube" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f6b3e"/><stop offset="0.3" stop-color="#e8cf9a"/><stop offset="0.55" stop-color="#b38d52"/><stop offset="1" stop-color="#6e5130"/></linearGradient>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1716"/><stop offset="0.35" stop-color="#4b4441"/><stop offset="1" stop-color="#151211"/></linearGradient>
<linearGradient id="bullet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d1f2a"/><stop offset="0.4" stop-color="#c2414e"/><stop offset="1" stop-color="#5c1520"/></linearGradient></defs>
<g>
<rect width="800" height="1000" fill="url(#bg)"/>
<!-- arch backdrop -->
<path d="M180 1000 L180 380 A220 220 0 0 1 620 380 L620 1000Z" fill="#e9d2c9"/>
<path d="M180 1000 L180 380 A220 220 0 0 1 620 380 L620 1000Z" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3"/>
<rect y="760" width="800" height="240" fill="#cfa99c"/>
<rect y="760" width="800" height="3" fill="#fff" opacity="0.4"/>
<!-- swatch -->
<path d="M90 860 C200 820 330 840 420 880 C330 900 200 900 90 860Z" fill="#a8323f" opacity="0.85"/>
<!-- lipstick -->
<g transform="translate(470 760)">
 <ellipse cx="20" cy="4" rx="120" ry="16" fill="#5a3a32" opacity="0.35" filter="url(#soft2)"/>
 <rect x="-60" y="-200" width="120" height="200" rx="10" fill="url(#base)"/>
 <rect x="-48" y="-196" width="10" height="190" rx="5" fill="#fff" opacity="0.18"/>
 <rect x="-52" y="-300" width="104" height="104" rx="6" fill="url(#tube)"/>
 <path d="M-40 -300 L-40 -400 Q-40 -420 -10 -440 L40 -470 L40 -300Z" fill="url(#bullet)"/>
 <path d="M-30 -310 L-30 -396" stroke="#fff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- cap lying -->
<g transform="translate(250 740) rotate(-90)">
 <rect x="-50" y="-60" width="100" height="190" rx="10" fill="url(#base)"/>
 <rect x="-40" y="-56" width="8" height="180" rx="4" fill="#fff" opacity="0.15"/>
</g></g>
<rect width="800" height="1000" filter="url(#grain)" opacity="0.3"/>
</svg>